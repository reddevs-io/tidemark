  <h3>Compose text-fit tests use native graphics</h3>
  <div class="details"><strong>Details</strong>Use @GraphicsMode(NATIVE) for tests that measure text; check ellipsis, didOverflowHeight and screen bounds, not didOverflowWidth; use positionInRoot and size because boundsInRoot is clipped by scrolling.</div>
