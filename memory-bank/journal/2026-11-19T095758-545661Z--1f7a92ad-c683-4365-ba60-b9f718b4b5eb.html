  <h3>One strings file per feature</h3>
  <div class="rationale"><strong>Rationale</strong>Android merges every file in values/, so parallel workstreams never edit the same XML.</div>
  <div class="details"><strong>Details</strong>Each feature owns values/strings_&lt;feature&gt;.xml and values-fr/strings_&lt;feature&gt;.xml; T-001 owns strings_common.xml.</div>
