  <h3>Normalize ICU spaces in formatted-text assertions</h3>
  <div class="details"><strong>Details</strong>Map U+00A0, U+202F and U+2009 to a plain space before comparing formatted text. Robolectric defaults to en-US, which resolves SYSTEM units to imperial.</div>
