<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Progress</title>
    <link href="memory-bank.css" rel="stylesheet">
    <style>
:root{--accent:var(--green);--accent-soft:rgba(61,220,145,.14);}
</style>
  </head>
  <body>
    <header class="page-head">
      <p class="eyebrow">Memory Bank / Progress</p>
      <h1>Progress</h1>
      <p class="meta">What's done, in flight, and up next · Updated 2026-11-19T09:49:48.488763Z</p>
    </header>
    <div class="stats-bar">
      <div class="stat done">
    <span class="count" id="count-done">0</span>
    <span class="label">Completed</span>
  </div>
      <div class="stat active">
    <span class="count" id="count-active">0</span>
    <span class="label">In Progress</span>
  </div>
      <div class="stat next">
    <span class="count" id="count-next">0</span>
    <span class="label">Next Steps</span>
  </div>
    </div>
    <h2>Milestones</h2>
    <table class="milestone-table">
      <thead>
        <tr><th>Milestone</th><th>Status</th><th>Updated</th></tr>
      </thead>
      <tbody>
        <tr class="placeholder"><td>—</td><td><span class="badge next">Planned</span></td><td>—</td></tr>
      </tbody>
    </table>
    <h2>Tasks</h2>
    <table class="task-table">
      <thead>
        <tr><th>Task</th><th>Status</th><th>Milestone</th><th>Date</th></tr>
      </thead>
      <tbody>
        <tr class="placeholder">
      <td>—</td>
      <td><span class="badge next">Upcoming</span></td>
      <td class="cell-milestone">—</td>
      <td>—</td>
    </tr>
      </tbody>
    </table>
    <p class="log-section-header">Activity Log</p>
    <script id="mb-counts">document.addEventListener('DOMContentLoaded',function(){
  [['count-done','done'],['count-active','active'],['count-next','next']].forEach(function(p){
    var el=document.getElementById(p[0]);
    if(el)el.textContent=document.querySelectorAll('.task-table tr:not(.placeholder) .badge.'+p[1]).length;
  });});</script>
  </body>
</html>
